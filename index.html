<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>직업 매칭 계산기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      margin-bottom: 20px;
      font-weight: 700;
    }

    /* 모드 선택 탭 */
    .mode-tabs {
      display: flex;
      margin-bottom: 20px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 7px rgba(0,0,0,0.06);
    }

    .mode-tab {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      background: #dcdde1;
      color: #2d3436;
      transition: 0.2s;
    }

    .mode-tab.active {
      background: #4b7bec;
      color: white;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .input-box {
      margin-bottom: 20px;
    }

    .input-label {
      font-size: 18px;
      margin-bottom: 8px;
      display: block;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1.5px solid #dcdde1;
      border-radius: 12px;
      outline: none;
    }

    input:focus {
      border-color: #4b7bec;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      border-radius: 12px;
      border: none;
      color: white;
      background: #4b7bec;
      font-weight: 700;
      margin-top: 10px;
      cursor: pointer;
    }

    button:active {
      background: #3867d6;
    }

    .result-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    /* 한 팀 블록 */
    .team-block {
      padding: 15px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 2px 7px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }

    .team-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .job-list {
      font-size: 16px;
      line-height: 1.6;
      padding-left: 8px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>직업 매칭 계산</h1>

    <!-- 🔵 모드 선택 탭 -->
    <div class="mode-tabs">
      <div id="tabPlus" class="mode-tab active" onclick="setMode('plus')">직플받</div>
      <div id="tabMinus" class="mode-tab" onclick="setMode('minus')">직빼받</div>
    </div>

    <div class="card">
      <div class="input-box">
        <span class="input-label">남자</span>
        <input id="maleScore" type="number" placeholder="예: 5">
      </div>

      <div class="input-box">
        <span class="input-label">여자</span>
        <input id="femaleScore" type="number" placeholder="예: 6">
      </div>

      <div class="input-box">
        <span id="targetLabel" class="input-label">직플받</span>
        <input id="targetScore" type="number" placeholder="예: 8">
      </div>

      <button onclick="findJobs()">결과 보기</button>
    </div>

    <div class="card">
      <div class="result-title">결과</div>
      <div id="result"></div>
    </div>
  </div>

<script>
/* 현재 계산 모드 */
let currentMode = "plus"; // 기본: 직플받

function setMode(mode) {
  currentMode = mode;

  // 탭 UI 업데이트
  document.getElementById("tabPlus").classList.toggle("active", mode === "plus");
  document.getElementById("tabMinus").classList.toggle("active", mode === "minus");

  // 라벨 변경
  document.getElementById("targetLabel").innerText =
    mode === "plus" ? "직플받" : "직빼받";
}

/* 마피아 팀 리스트 */
const mafiaTeam = [
  "마피아", "짐승인간", "스파이", "마담", 
  "도둑", "마녀", "과학자", "사기꾼", "청부업자"
];

/* 직업 데이터 */
const jobs = [
  ["마피아", "M", 3, 0],
  ["경찰", "M", 2, 2],
  ["자경단원", "F", 4, 3],
  ["의사", "M", 2, 0],
  ["요원", "M", 2, 1],
  ["짐승인간", "M", 4, 4],
  ["스파이", "F", 3, 0],
  ["마담", "F", 2, 1],
  ["도둑", "M", 2, 1],
  ["마녀", "F", 2, 0],
  ["과학자", "F", 3, 1],
  ["사기꾼", "M", 3, 1],
  ["청부업자", "M", 4, 2],
  ["군인", "M", 2, 2],
  ["연인(남자)", "M", 2, 2],
  ["연인(여자)", "F", 2, 2],
  ["기자", "F", 2, 0],
  ["사립탐정", "M", 4, 3],
  ["테러리스트", "F", 5, 0],
  ["예언자", "M", 3, 1],
  ["정치인", "M", 3, 2],
  ["영매", "F", 2, 1],
  ["건달", "M", 2, 1],
  ["도굴꾼", "M", 3, 2],
  ["성직자", "F", 3, 2],
  ["판사", "M", 2, 1],
  ["간호사", "F", 3, 1],
  ["마술사", "M", 3, 1],
  ["해커", "M", 2, 0],
  ["심리학자", "F", 4, 2],
  ["용병", "M", 2, 2],
  ["공무원", "F", 3, 2],
  ["비밀결사(여자)", "F", 4, 2],
  ["비밀결사(남자)", "M", 4, 2],
  ["파파라치", "F", 4, 0],
  ["최면술사", "F", 4, 2],
  ["점쟁이", "F", 3, 2]
];

function isMafia(name) {
  return mafiaTeam.includes(name);
}

function findJobs() {
  const male = Number(document.getElementById("maleScore").value);
  const female = Number(document.getElementById("femaleScore").value);
  const target = Number(document.getElementById("targetScore").value);

  const resultBox = document.getElementById("result");
  resultBox.innerHTML = "";

  if (isNaN(male) || isNaN(female) || isNaN(target)) {
    resultBox.innerHTML = "<div>모든 값을 입력해주세요.</div>";
    return;
  }

  /* 모드별 계산 공식 */
  const matched = jobs.filter(([name, gender, letters, batchim]) => {
    const genderScore = (gender === "M") ? male : female;

    let total = 0;

    if (currentMode === "plus") {
      total = letters + batchim + genderScore; // 직플받
    } else {
      total = letters - batchim + genderScore; // 직빼받
    }

    return total === target;
  });

  const citizenList = matched.filter(([name]) => !isMafia(name));
  const mafiaList = matched.filter(([name]) => isMafia(name));

  if (matched.length === 0) {
    resultBox.innerHTML = "<div>조건에 맞는 직업이 없습니다.</div>";
    return;
  }

  /* 시민팀 출력 */
  if (citizenList.length > 0) {
    const names = citizenList.map(([name]) => name).join(", ");

    resultBox.innerHTML += `
      <div class="team-block">
        <div class="team-title" style="color:#3867d6;">시민팀</div>
        <div class="job-list" style="color:#3867d6;">${names}</div>
      </div>
    `;
  }

  /* 마피아팀 출력 */
  if (mafiaList.length > 0) {
    const names = mafiaList.map(([name]) => name).join(", ");

    resultBox.innerHTML += `
      <div class="team-block">
        <div class="team-title" style="color:#eb3b5a;">마피아팀</div>
        <div class="job-list" style="color:#eb3b5a;">${names}</div>
      </div>
    `;
  }
}
</script>

</body>
</html>
