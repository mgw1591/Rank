<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>직업 매칭 계산기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #f5f6fa;
  --text: #2d3436;
  --card-bg: #ffffff;
  --border: #dcdde1;
  --primary: #4b7bec;
  --primary-dark: #3867d6;
  --citizen: #3867d6;
  --mafia: #eb3b5a;
}

body.dark {
  --bg: #1e272e;
  --text: #d2dae2;
  --card-bg: #2f3640;
  --border: #485460;
  --primary: #34ace0;
  --primary-dark: #227093;
  --citizen: #34ace0;
  --mafia: #ff5252;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
  transition: 0.25s;
  margin: 0; padding: 0;
}

.container {
  max-width: 480px;
  margin: 0 auto;
  padding: 20px;
}

.dark-toggle {
  text-align: right;
  cursor: pointer;
  font-size: 22px;
  margin-bottom: 10px;
  user-select: none;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

.mode-tabs {
  display: flex;
  margin-bottom: 20px;
  border-radius: 12px;
  overflow: hidden;
}

.mode-tab {
  flex: 1;
  text-align: center;
  padding: 12px 0;
  background: var(--border);
  color: var(--text);
  font-weight: 600;
  cursor: pointer;
}

.mode-tab.active {
  background: var(--primary);
  color: white;
}

.card {
  background: var(--card-bg);
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.input-box {
  margin-bottom: 20px;
}

.input-label {
  font-size: 18px;
  margin-bottom: 8px;
  font-weight: 600;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--card-bg);
  color: var(--text);
  font-size: 16px;
}

textarea {
  height: 70px;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: var(--primary);
  color: white;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
}

.team-block {
  background: var(--card-bg);
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 20px;
}

.team-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 10px;
}

.job-list {
  font-size: 16px;
  line-height: 1.6;
}

.variable-hint table td {
  padding: 4px 0;
}
</style>
</head>

<body>
<div class="container">

<div class="dark-toggle" onclick="toggleDarkMode()">🌙</div>

<h1>직업 매칭 계산</h1>

<div class="mode-tabs">
  <div id="tabPlus" class="mode-tab active" onclick="setMode('plus')">직플받</div>
  <div id="tabMinus" class="mode-tab" onclick="setMode('minus')">직빼받</div>
  <div id="tabCustom" class="mode-tab" onclick="setMode('custom')">결과</div>
</div>

<div class="card">

  <div class="input-box">
    <span class="input-label">남자</span>
    <input id="maleScore" type="number">
  </div>

  <div class="input-box">
    <span class="input-label">여자</span>
    <input id="femaleScore" type="number">
  </div>

  <div class="input-box">
    <span id="targetLabel" class="input-label">직플받</span>
    <input id="targetScore" type="number">
  </div>

  <!-- Custom 수식 UI -->
  <div id="customArea" style="display:none;">

    <div class="input-box">
      <span class="input-label">계산식 템플릿</span>
      <select id="formulaTemplate" onchange="applyTemplate()">
        <option value="">템플릿 선택</option>
        <option value="글자수 + 받침수 + 남녀">직플받</option>
        <option value="글자수 - 받침수 + 남녀">직빼받</option>
        <option value="(글자수 * 받침수) + 남녀">직곱받</option>
        <option value="글자수 + 줄">글자수+시민팀</option>
      </select>
    </div>

    <div class="input-box">
      <span class="input-label">수식 입력 (직접 수정 가능)</span>
      <textarea id="customFormula"></textarea>

      <div class="variable-hint">
        <table style="font-size:14px; width:100%; margin-top:10px;">
          <tr><td><b>글자수</b></td><td>직업 글자수</td></tr>
          <tr><td><b>받침수</b></td><td>받침 개수</td></tr>
          <tr><td><b>남녀</b></td><td>입력한 성별 점수</td></tr>
          <tr><td><b>줄</b></td><td>시민/마피아 줄 번호</td></tr>
          <tr><td><b>칸</b></td><td>몇 번째 칸</td></tr>
          <tr><td><b>상수</b></td><td>1, 2, 3 등 숫자</td></tr>
        </table>
      </div>
    </div>
  </div>

  <button onclick="findJobs()">결과 보기</button>
</div>

<div class="card">
  <div class="result-title">결과</div>
  <div id="result"></div>
</div>

</div>

<script>
/* 다크모드 */
if (localStorage.getItem("darkMode") === "true") {
  document.body.classList.add("dark");
  document.querySelector(".dark-toggle").innerText = "☀️";
}
function toggleDarkMode() {
  const dark = document.body.classList.toggle("dark");
  document.querySelector(".dark-toggle").innerText = dark ? "☀️" : "🌙";
  localStorage.setItem("darkMode", dark);
}

/* 모드 */
let currentMode = "plus";

function setMode(m) {
  currentMode = m;
  document.getElementById("tabPlus").classList.toggle("active", m==="plus");
  document.getElementById("tabMinus").classList.toggle("active", m==="minus");
  document.getElementById("tabCustom").classList.toggle("active", m==="custom");

  document.getElementById("customArea").style.display =
    (m === "custom" ? "block" : "none");

  document.getElementById("targetLabel").innerText =
    m === "plus" ? "직플받" :
    m === "minus" ? "직빼받" : "결과";
}

/* 템플릿 적용 */
function applyTemplate() {
  const t = document.getElementById("formulaTemplate").value;
  document.getElementById("customFormula").value = t;
}

/* 직업 데이터 */
const jobs = [
  ["마피아","M",3,0,1,1],["경찰","M",2,2,1,2],["자경단원","F",4,3,2,3],
  ["의사","M",2,0,5,5],["요원","M",2,1,1,4],["짐승인간","M",4,4,1,1],
  ["스파이","F",3,0,1,2],["마담","F",2,1,3,3],["도둑","M",2,1,1,4],
  ["마녀","F",2,0,5,5],["과학자","F",3,1,2,1],["사기꾼","M",3,1,2,2],
  ["청부업자","M",4,2,3,3],["군인","M",2,2,1,1],["연인(남자)","M",2,2,1,4],
  ["연인(여자)","F",2,2,1,4],["기자","F",2,0,5,5],["사립탐정","M",4,3,2,2],
  ["테러리스트","F",5,0,2,4],["예언자","M",3,1,3,1],["정치인","M",3,2,1,2],
  ["영매","F",2,1,3,3],["건달","M",2,1,2,1],["도굴꾼","M",3,2,2,3],
  ["성직자","F",3,2,5,5],["판사","M",2,1,3,2],["간호사","F",3,1,3,3],
  ["마술사","M",3,1,3,4],["해커","M",2,0,3,5],["심리학자","F",4,2,4,1],
  ["용병","M",2,2,4,2],["공무원","F",3,2,4,3],["비밀결사(여자)","F",4,2,4,4],
  ["비밀결사(남자)","M",4,2,4,4],["파파라치","F",4,0,4,5],["최면술사","F",4,2,5,1],
  ["점쟁이","F",3,2,5,2]
];

/* 마피아 */
const mafiaTeam = ["마피아","짐승인간","스파이","마담","도둑","마녀","과학자","사기꾼","청부업자"];
function isMafia(name) { return mafiaTeam.includes(name); }

/* 한글 변수 기반 계산 */
function computeScore(job, male, female, formula) {
  const [name, gender, letters, batchim, lineNumber, posNumber] = job;

  const genderScore = (gender === "M" ? male : female);

  const variables = {
    글자수: letters,
    받침수: batchim,
    남녀: genderScore,
    줄: lineNumber,
    칸: posNumber
  };

  const keys = Object.keys(variables);
  const values = Object.values(variables);

  const fn = new Function(...keys, "return " + formula);
  return fn(...values);
}

/* 메인 계산 */
function findJobs() {
  const male = Number(document.getElementById("maleScore").value);
  const female = Number(document.getElementById("femaleScore").value);
  const target = Number(document.getElementById("targetScore").value);

  const result = document.getElementById("result");
  result.innerHTML = "";

  if (isNaN(male) || isNaN(female) || isNaN(target)) {
    result.innerHTML = "모든 값을 입력하세요.";
    return;
  }

  let formula = "";
  if (currentMode === "plus")
    formula = "글자수 + 받침수 + 남녀";
  else if (currentMode === "minus")
    formula = "글자수 - 받침수 + 남녀";
  else
    formula = document.getElementById("customFormula").value;

  const matched = jobs.filter(job => computeScore(job, male, female, formula) === target);

  if (matched.length === 0) {
    result.innerHTML = "조건에 맞는 직업이 없습니다.";
    return;
  }

  const citizen = matched.filter(j => !isMafia(j[0]));
  const mafia = matched.filter(j => isMafia(j[0]));

  if (citizen.length > 0) {
    result.innerHTML += `
      <div class="team-block">
        <div class="team-title" style="color:var(--citizen)">시민팀</div>
        <div class="job-list" style="color:var(--citizen)">
          ${ citizen.map(j => j[0]).join(", ") }
        </div>
      </div>
    `;
  }
  if (mafia.length > 0) {
    result.innerHTML += `
      <div class="team-block">
        <div class="team-title" style="color:var(--mafia)">마피아팀</div>
        <div class="job-list" style="color:var(--mafia)">
          ${ mafia.map(j => j[0]).join(", ") }
        </div>
      </div>
    `;
  }
}
</script>

</body>
</html>
